<!-- @dsCard group="Components" -->
<style>
  * { margin: 0; box-sizing: border-box; }
  body { display: flex; font-family: ui-monospace, Menlo, monospace; }
  .half { flex: 1; padding: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .night { background: #0F2A1E; }
  .day { background: #f4efe4; }
  .btn { font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 28px; border: 1px solid transparent; }
  .primary-n { background: #E989B7; color: #0F2A1E; box-shadow: 0 0 32px -6px #E989B7; }
  .primary-d { background: #CE3D86; color: #f4efe4; box-shadow: 0 0 32px -6px rgba(206,61,134,0.6); }
  .brut-n { background: transparent; color: #F1ECDB; border-color: #F1ECDB; box-shadow: 3px 3px 0 #E3C86B; }
  .brut-d { background: transparent; color: #2B2E66; border-color: #2B2E66; box-shadow: 3px 3px 0 #C9A02E; }
  .ghost-n { background: transparent; color: #A2B8A7; border-color: rgba(241,236,219,0.14); }
  .ghost-d { background: transparent; color: #6B6D9E; border-color: rgba(43,46,102,0.16); }
  .pill { border-radius: 999px; padding: 7px 12px; font-size: 10px; letter-spacing: 0.15em; }
  .pill-n { color: #A2B8A7; border: 1px solid rgba(241,236,219,0.1); }
  .pill-d { color: #6B6D9E; border: 1px solid rgba(43,46,102,0.12); }
  .tag { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; border: 1px solid; }
  .cap { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.55; margin-top: 6px; }
  .night .cap { color: #A2B8A7; } .day .cap { color: #6B6D9E; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
<body>
  <div class="half night">
    <div class="row"><button class="btn primary-n">Sign in</button><button class="btn brut-n">Archive</button></div>
    <div class="row"><button class="btn ghost-n">Secondary</button><button class="pill pill-n">⌘K</button></div>
    <div class="row">
      <span class="tag" style="background:rgba(241,236,219,0.05);color:#A2B8A7;border-color:rgba(241,236,219,0.12)">Task</span>
      <span class="tag" style="background:rgba(233,137,183,0.12);color:#E989B7;border-color:rgba(233,137,183,0.3)">Urgent</span>
      <span class="tag" style="background:rgba(90,99,216,0.14);color:#8FA0F0;border-color:rgba(122,133,235,0.35)">Academic</span>
      <span class="tag" style="background:rgba(227,200,107,0.12);color:#E3C86B;border-color:rgba(227,200,107,0.3)">Money</span>
      <span class="tag" style="background:rgba(91,196,180,0.12);color:#5BC4B4;border-color:rgba(91,196,180,0.3)">Health</span>
    </div>
    <p class="cap">Buttons &amp; tags — night · glow primary, brutalist offset, five-hue tags</p>
  </div>
  <div class="half day">
    <div class="row"><button class="btn primary-d">Sign in</button><button class="btn brut-d">Archive</button></div>
    <div class="row"><button class="btn ghost-d">Secondary</button><button class="pill pill-d">⌘K</button></div>
    <div class="row">
      <span class="tag" style="background:rgba(43,46,102,0.05);color:#6B6D9E;border-color:rgba(43,46,102,0.14)">Task</span>
      <span class="tag" style="background:rgba(206,61,134,0.08);color:#CE3D86;border-color:rgba(206,61,134,0.3)">Urgent</span>
      <span class="tag" style="background:rgba(58,65,184,0.08);color:#3A41B8;border-color:rgba(58,65,184,0.3)">Academic</span>
      <span class="tag" style="background:rgba(201,160,46,0.1);color:#B5882C;border-color:rgba(201,160,46,0.35)">Money</span>
      <span class="tag" style="background:rgba(46,159,180,0.08);color:#2E9FB4;border-color:rgba(46,159,180,0.3)">Health</span>
    </div>
    <p class="cap">Buttons &amp; tags — day · same set in day hues</p>
  </div>
</body>
