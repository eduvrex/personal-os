<!-- @dsCard group="Brand" -->
<style>
  * { margin: 0; box-sizing: border-box; }
  body { display: flex; font-family: ui-monospace, Menlo, monospace; }
  .half { flex: 1; height: 320px; position: relative; overflow: hidden; }
  .night { background: #0F2A1E; }
  .day { background: #f4efe4; }
  .glow { position: absolute; inset: -10%; }
  .night .glow { background:
    radial-gradient(52% 44% at 30% 62%, rgba(240,233,213,0.8), rgba(240,233,213,0) 68%),
    radial-gradient(58% 50% at 10% 6%, rgba(150,182,158,0.4), transparent 70%),
    radial-gradient(44% 52% at 86% 16%, rgba(88,140,86,0.45), transparent 70%),
    radial-gradient(72% 62% at 82% 98%, rgba(5,18,11,0.75), transparent 78%); }
  .day .glow { background:
    radial-gradient(34% 11% at 25% 14%, rgba(125,130,207,0.5), transparent 72%),
    radial-gradient(26% 9% at 30% 29%, rgba(201,160,46,0.38), transparent 72%),
    radial-gradient(24% 9% at 23% 46%, rgba(206,61,134,0.4), transparent 70%),
    radial-gradient(30% 10% at 28% 63%, rgba(46,159,180,0.35), transparent 72%),
    radial-gradient(22% 8% at 25% 79%, rgba(58,65,184,0.32), transparent 70%),
    radial-gradient(30% 9% at 29% 93%, rgba(125,130,207,0.32), transparent 72%); }
  .edge { position: absolute; top: -4%; bottom: -4%; left: 56%; width: 20px; filter: blur(7px); opacity: 0.85;
    background: linear-gradient(180deg, #3A41B8, #E3C86B 16%, #2A2E7A 32%, #CE3D86 48%, #2FA3AE 60%, #3A41B8 74%, #E3C86B 88%, #2A2E7A); }
  .grid { position: absolute; inset: 0; pointer-events: none; }
  .night .grid { background:
    linear-gradient(rgba(241,236,219,0.045) 1px, transparent 1px) 0 0 / 100% 64px,
    linear-gradient(90deg, rgba(241,236,219,0.045) 1px, transparent 1px) 0 0 / 64px 100%; }
  .day .grid { background:
    linear-gradient(rgba(43,46,102,0.05) 1px, transparent 1px) 0 0 / 100% 64px,
    linear-gradient(90deg, rgba(43,46,102,0.05) 1px, transparent 1px) 0 0 / 64px 100%; }
  .grain { position: absolute; inset: 0; mix-blend-mode: overlay; pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.55"/></svg>'); }
  .night .grain { opacity: 0.3; }
  .day .grain { opacity: 0.14; }
  /* mid-century geometry */
  .circle-o { position: absolute; border-radius: 999px; }
  .night .c1 { top: 34px; right: 52px; width: 110px; height: 110px; border: 1px solid rgba(241,236,219,0.35); }
  .night .c2 { top: 118px; right: 36px; width: 18px; height: 18px; background: #E989B7; }
  .night .c3 { top: 22px; right: 148px; width: 10px; height: 10px; background: #E3C86B; }
  .day .c1 { top: -46px; right: 64px; width: 130px; height: 65px; border-radius: 0 0 130px 130px; background: #C9A02E; opacity: 0.85; }
  .day .c2 { bottom: 78px; right: 130px; width: 84px; height: 84px; border: 1px solid #3A41B8; }
  .day .c3 { bottom: 104px; right: 104px; width: 26px; height: 26px; background: #2E9FB4; }
  .day .c4 { top: 96px; right: 40px; width: 12px; height: 12px; background: #CE3D86; }
  /* registration + coords */
  .reg { position: absolute; font-size: 11px; opacity: 0.55; }
  .night .reg { color: #F1ECDB; } .day .reg { color: #2B2E66; }
  .coords { position: absolute; top: 12px; left: 16px; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; }
  .night .coords { color: #A2B8A7; } .day .coords { color: #6B6D9E; }
  .ticks { position: absolute; top: 0; bottom: 0; right: 8px; width: 8px; pointer-events: none; }
  .night .ticks { background: repeating-linear-gradient(180deg, rgba(241,236,219,0.35) 0 1px, transparent 1px 16px); }
  .day .ticks { background: repeating-linear-gradient(180deg, rgba(43,46,102,0.35) 0 1px, transparent 1px 16px); }
  .label { position: absolute; bottom: 12px; left: 16px; right: 16px; font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .night .label { color: #A2B8A7; } .day .label { color: #6B6D9E; }
  .label .block { width: 42px; height: 3px; flex: none; }
  .night .label .block { background: #F1ECDB; }
  .day .label .block { background: #2B2E66; }
  .mark { position: absolute; bottom: 42px; left: 16px; right: 16px; font-family: Fraunces, Didot, Georgia, serif; font-size: 72px; line-height: 1; color: transparent; white-space: nowrap; }
  .night .mark { -webkit-text-stroke: 1px rgba(241,236,219,0.14); }
  .day .mark { -webkit-text-stroke: 1px rgba(43,46,102,0.14); }
</style>
<body>
  <div class="half night">
    <div class="glow"></div>
    <div class="grid"></div>
    <span class="circle-o c1"></span><span class="circle-o c2"></span><span class="circle-o c3"></span>
    <span class="reg" style="top:10px;right:20px">+</span>
    <span class="reg" style="bottom:34px;left:6px">+</span>
    <p class="coords">FLD 01 · 52.3°N — GRAIN 0.30</p>
    <div class="ticks"></div>
    <div class="grain"></div>
    <div class="mark">Personal OS ✳</div>
    <p class="label"><span class="block"></span>Night · float green — glow, grid + grain</p>
  </div>
  <div class="half day">
    <div class="glow"></div>
    <span class="edge"></span>
    <div class="grid"></div>
    <span class="circle-o c1"></span><span class="circle-o c2"></span><span class="circle-o c3"></span><span class="circle-o c4"></span>
    <span class="reg" style="top:10px;left:6px">+</span>
    <span class="reg" style="bottom:34px;right:20px">+</span>
    <p class="coords" style="left:auto;right:24px">FLD 02 · PIGMENT / CHROMA</p>
    <div class="ticks" style="right:auto;left:8px"></div>
    <div class="grain"></div>
    <div class="mark">Personal OS ✳</div>
    <p class="label"><span class="block"></span>Day · pigment bands — geometry on paper</p>
  </div>
</body>
